[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layalog"
version = "0.1.0"
description = "LayaLog - Sistema Inteligente de Análise e Classificação de Logs com IA"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.2.0",
    "laya>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["layalog*"]
